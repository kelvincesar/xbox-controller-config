[package]
name = "xbox_led"
version = "0.1.0"
edition = "2021"
description = "Xbox controller (GIP) packet encoding, compiled to WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
