server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The stock mime.types already maps .wasm to application/wasm. Don't add a
    # `types {}` block here: it would replace the whole map, not extend it.

    gzip on;
    gzip_types text/css application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Hashed build output never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # Everything loads from this origin; wasm-unsafe-eval lets the page compile its WebAssembly.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        # USB and HID are what the page is for; nothing else is needed.
        add_header Permissions-Policy "usb=(self), hid=(self), bluetooth=(), camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
